# metawtf.conf — sample configuration; copy to your working directory.
#
# SYNTAX
#   file        = (comment | blank | directive)*   one directive per line
#   comment     = line whose first non-space character is #
#                 (no trailing comments; # elsewhere is an ordinary character)
#   directive   = name [positional] [option]*
#   name        = sample | time | echo | hz | proc_cpu | sys_cpu
#   positional  = VALUE      at most one; the topic (echo/hz only)
#   option      = KEY "=" VALUE   no spaces around =
#   VALUE       = one or more non-whitespace characters
#                 (no quoting, no escaping, no spaces inside a value)
#   list        = VALUE {"," VALUE}   comma-separated inside one token
#   Tokens are separated by whitespace; a repeated KEY on one line is an
#   error; all errors report the line number.
#
# DIRECTIVES
#   sample HZ                          rows per second, float > 0 (default 5.0)
#   time [format=STRFTIME] [width=INT] leading timestamp column
#   format (human|csv)                 output format; default is human on a
#                                      tty, csv when piped or redirected
#   echo TOPIC field=PATH[,PATH...] [name=H[,H...]] [type=MSG]
#        [stale_after=SECS] [width=INT[,INT...]] [json=true] [subfields=KEY,KEY]
#                                      latest value(s) of message field(s); a
#                                      comma list in field= (or subfields=) makes
#                                      one column per key, and name= / width=
#                                      then take one value per column
#
#   PATH segments are attribute names joined by ".", each optionally indexed:
#   NAME[N]     integer index into an array-valued field; negative counts from
#               the end (detections[0].id, detections[-1].id)
#   NAME.#      final segment only: length of an array-valued field, e.g.
#               detections.# -> len(detections). Reads 0 on an empty array --
#               that is a value, not a "?", which is what makes it answer
#               "how many" (an indexed path on the same empty array does show
#               "?", since there is no element 0 to read)
#   hz (TOPIC | match=REGEX) [window=SECS] [name=H] [width=INT]
#                                      receive rate; one column per match
#   proc_cpu name=H process=REGEX [width=INT]
#                                      CPU% of matching processes
#   sys_cpu name=H mode=(busy|idle) [width=INT]
#                                      system-wide CPU percent
#
# RULES
#   - bool values are exactly true or false; numbers are bare (2, 2.0)
#   - width is a minimum cell width, int > 0 (defaults: echo 8, others 6);
#     with a multi-field/subfields echo it is a comma list, one per column
#   - a single-field echo names its column with name= (default: sanitized topic
#     /a/b -> a_b); a multi-field/subfields echo auto-names columns <topic>_<key>
#     unless name= gives one header per column (count must match)
#   - name= is forbidden with match=
#   - field= is required; a comma list makes one column per path from one
#     subscription and cannot combine with json=/subfields=
#   - subfields requires json=true; omit it to expand all top-level keys
#   - window must be >= the sample period
#   - unknown directives or keys are rejected at startup

sample 1.0

echo /cmd_vel_nav field=linear.x name=nav
echo /cmd_vel field=linear.x name=cmd_vel
echo /cmd_vel_smoothed field=linear.x name=cmd_vel_smoothed
