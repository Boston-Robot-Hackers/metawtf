# load-thermal-survey.conf — host load, chip temp, and rates on one timeline
#
# A real-world example (adapted from the dome_vision project) showing why
# you'd combine multi-field echo, hz, sys_cpu, and proc_cpu in one config:
# diagnosing an undervoltage reset meant reading host CPU, OAK chip
# temperature, and the frame rates that drive both against a shared clock,
# since none of those tell the story alone.
#
# Run:
#   metawtf -f conf/load-thermal-survey.conf
# Redirect for CSV instead of the live view (format auto-detects: tty ->
# human, pipe -> csv):
#   metawtf -f conf/load-thermal-survey.conf > survey-$(date +%F-%H%M).csv

sample 2

time width=7 format=%M.%S

# Loop timing. pipeline_get_ms is mostly blocked waiting on the camera at
# its fps, so iter_ms minus pget is roughly the host's real per-frame work.
echo /telemetry/oak field=fps,iter_ms,pipeline_get_ms name=fps,iter,pget width=5,6,6

# Host-side tracker cost per frame — watch this for a duplicate-track
# failure mode (climbs when track count explodes; read against ntrk below).
echo /telemetry/oak field=tracker_ms name=trkms width=6

# Live track count straight off the detections topic. 0 on an empty frame
# is a value, not "?" — length answers "how many," unlike indexing.
echo /oak/detections field=detections.# name=ntrk width=5

# The two that matter for a brownout: leon_css drives USB, chip_temp_c is
# the camera's own sensor.
echo /telemetry/oak field=chip_temp_c,leon_css_cpu_pct,leon_mss_cpu_pct name=temp,css,mss width=5,5,5

# Actual delivered rates, independent of what the node claims.
hz /oak/detections window=2.0 name=det width=5
hz /oak/detections_3d window=2.0 name=d3d width=5
hz /tf window=2.0 name=tf width=5

# Empty downstream state with detections still flowing points at TF or
# promotion, not detection.
hz /targets/confirmed window=2.0 name=tgts width=5

sys_cpu name=cpu mode=busy width=5
proc_cpu name=node process=dome_vision_ros_node width=5
